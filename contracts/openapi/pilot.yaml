openapi: 3.0.3
info: {title: EcomPilot API, version: 1.0.0}
servers: [{url: "http://127.0.0.1:8085"}]
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
    internal: {type: apiKey, in: header, name: X-Internal-Token}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string}, message: {type: string}, details: {type: object}}
    ItemIn:
      type: object
      required: [sku_id, qty]
      properties: {sku_id: {type: string}, qty: {type: integer, minimum: 1}}
    Addon:
      type: object
      required: [sku_id, sku_name, unit_price_cents, saving_cents]
      properties:
        sku_id: {type: string}
        sku_name: {type: string}
        unit_price_cents: {type: integer}
        qty: {type: integer}
        saving_cents: {type: integer, description: "加购后实付比不加购减少的分值, >0"}
        payable_with_addon_cents: {type: integer}
    Quote:
      type: object
      required: [quote_id, items, total_original_cents, total_discount_cents, total_payable_cents, expires_at]
      properties:
        quote_id: {type: string}
        items:
          type: array
          items:
            type: object
            required: [sku_id, qty, unit_price_cents, original_cents, discount_share_cents, payable_cents]
            properties:
              sku_id: {type: string}
              qty: {type: integer}
              shop_id: {type: string}
              unit_price_cents: {type: integer}
              original_cents: {type: integer}
              discount_share_cents: {type: integer}
              payable_cents: {type: integer}
        coupon_ids: {type: array, items: {type: string}}
        promo_rule_id: {type: string, nullable: true}
        total_original_cents: {type: integer}
        total_discount_cents: {type: integer}
        total_payable_cents: {type: integer}
        gap_to_next_tier_cents: {type: integer, nullable: true}
        suggested_addons: {type: array, items: {$ref: "#/components/schemas/Addon"}}
        expires_at: {type: string}
    Order:
      type: object
      required: [order_id, order_status, total_original_cents, total_discount_cents, total_payable_cents, items]
      properties:
        order_id: {type: string}
        order_status: {type: string, enum: [CREATED, CLOSED_OUT_OF_STOCK, STOCK_LOCKED, PAID_SIMULATED, FULFILLED, AFTER_SALE_OPEN, REFUNDING, REFUNDED_PARTIAL, REFUNDED_FULL, CANCELLED]}
        idempotent_replayed: {type: boolean}
        quote_id: {type: string}
        total_original_cents: {type: integer}
        total_discount_cents: {type: integer}
        total_payable_cents: {type: integer}
        refunded_cents: {type: integer}
        created_at: {type: string}
        pay_deadline_at: {type: string}
        items:
          type: array
          items:
            type: object
            required: [order_item_id, sku_id, qty, payable_cents]
            properties:
              order_item_id: {type: string}
              sku_id: {type: string}
              sku_name: {type: string}
              catalog_category_id: {type: string}
              qty: {type: integer}
              unit_price_cents: {type: integer}
              original_cents: {type: integer}
              discount_share_cents: {type: integer}
              payable_cents: {type: integer}
              refunded_cents: {type: integer}
    Candidate:
      type: object
      required: [order_id, order_status, items]
      properties:
        order_id: {type: string}
        order_status: {type: string}
        total_payable_cents: {type: integer}
        created_at: {type: string}
        category_match: {type: boolean}
        items: {type: array, items: {type: object}}
    RefundExecuteIn:
      type: object
      required: [refund_idempotency_key, claim_no, order_id, approved_refund_cents, restock_policy]
      properties:
        refund_idempotency_key: {type: string}
        claim_no: {type: string}
        order_id: {type: string}
        order_item_id: {type: string, nullable: true}
        approved_refund_cents: {type: integer, minimum: 1}
        restock_policy: {type: string, enum: [SELLABLE_WAREHOUSE, DEFECTIVE_WAREHOUSE, NO_RESTOCK]}
        approval_mode: {type: string}
        supervisor_user_id: {type: string}
        approved_at: {type: string}
    RefundStatus:
      type: object
      required: [refund_idempotency_key, execution_status]
      properties:
        refund_idempotency_key: {type: string}
        refund_execution_id: {type: string, nullable: true}
        order_id: {type: string, nullable: true}
        execution_status: {type: string, enum: [SUCCESS, FAILED, NOT_FOUND]}
        order_status_after: {type: string, nullable: true}
        refunded_cents: {type: integer}
        idempotent_replayed: {type: boolean}
        executed_at: {type: string, nullable: true}
  responses:
    Err: {description: error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
security: [{bearer: []}]
paths:
  /health:
    get:
      security: []
      responses: {"200": {description: ok}}
  /api/v1/quotes:
    post:
      summary: 报价/受控凑单算价
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ItemIn"}}
                coupon_ids: {type: array, items: {type: string}}
                auto_coupon: {type: boolean, description: "true 且未给 coupon_ids 时自动择优 1 张"}
      responses:
        "201": {description: quote, content: {application/json: {schema: {$ref: "#/components/schemas/Quote"}}}}
        "404": {$ref: "#/components/responses/Err"}
        "409": {$ref: "#/components/responses/Err"}
        "422": {$ref: "#/components/responses/Err"}
  /api/v1/quotes/{quote_id}/confirm-addons:
    post:
      summary: 用户勾选凑单建议后生成新报价
      parameters: [{name: quote_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addon_sku_ids]
              properties: {addon_sku_ids: {type: array, items: {type: string}}}
      responses:
        "201": {description: new quote, content: {application/json: {schema: {$ref: "#/components/schemas/Quote"}}}}
        "404": {$ref: "#/components/responses/Err"}
        "422": {$ref: "#/components/responses/Err"}
  /api/v1/orders/create:
    post:
      summary: 幂等下单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, quote_id]
              properties: {idempotency_key: {type: string}, quote_id: {type: string}}
      responses:
        "200": {description: idempotent replay, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        "404": {$ref: "#/components/responses/Err"}
        "409": {$ref: "#/components/responses/Err"}
        "422": {$ref: "#/components/responses/Err"}
        "503": {$ref: "#/components/responses/Err"}
  /api/v1/orders:
    get:
      summary: 当前用户订单列表
      responses: {"200": {description: ok, content: {application/json: {schema: {type: object, properties: {orders: {type: array, items: {$ref: "#/components/schemas/Order"}}}}}}}}
  /api/v1/orders/{order_id}:
    get:
      parameters: [{name: order_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        "404": {$ref: "#/components/responses/Err"}
  /api/v1/orders/{order_id}/pay:
    post:
      summary: 模拟支付 STOCK_LOCKED -> PAID_SIMULATED
      parameters: [{name: order_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        "404": {$ref: "#/components/responses/Err"}
        "409": {$ref: "#/components/responses/Err"}
  /api/v1/orders/{order_id}/cancel:
    post:
      summary: 幂等取消(STOCK_LOCKED)或未发货整单退款(PAID_SIMULATED)
      parameters: [{name: order_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok(含幂等重复调用), content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        "404": {$ref: "#/components/responses/Err"}
        "409": {$ref: "#/components/responses/Err"}
  /internal/v1/orders/{order_id}/fulfill:
    post:
      summary: 商家发货 PAID_SIMULATED -> FULFILLED
      security: [{internal: []}]
      parameters: [{name: order_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        "404": {$ref: "#/components/responses/Err"}
        "409": {$ref: "#/components/responses/Err"}
  /api/v1/aftersales/candidates:
    post:
      summary: 免订单号反查候选订单(只读, 不产生任何记录)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {text: {type: string}, category_hint: {type: string}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, required: [candidates], properties: {candidates: {type: array, items: {$ref: "#/components/schemas/Candidate"}}, nlu_signal: {type: object, nullable: true}}}}}}
  /api/v1/aftersales/confirm:
    post:
      summary: 用户确认订单子项并提交售后申请(提交至 Ops)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, order_item_id]
              properties:
                order_id: {type: string}
                order_item_id: {type: string}
                buyer_reason_text: {type: string}
                evidence_urls: {type: array, items: {type: string}}
      responses:
        "202": {description: submitted, content: {application/json: {schema: {type: object, required: [claim_no, claim_status], properties: {claim_no: {type: string}, claim_status: {type: string}, order_status: {type: string}}}}}}
        "403": {$ref: "#/components/responses/Err"}
        "404": {$ref: "#/components/responses/Err"}
        "409": {$ref: "#/components/responses/Err"}
        "502": {$ref: "#/components/responses/Err"}
  /api/v1/aftersales/{claim_no}:
    get:
      summary: 买家查询自己售后申请的进度（审核端状态来自 Ops；Ops 不可用时返回本地状态并标 ops_available=false）
      parameters: [{name: claim_no, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, required: [claim_no, order_id, order_status, claim_status, needs_evidence, ops_available, result_reason], properties: {claim_no: {type: string}, order_id: {type: string}, order_status: {type: string}, claim_status: {type: string}, needs_evidence: {type: boolean}, ops_available: {type: boolean}, result_reason: {type: string, nullable: true, description: "审核端驳回原因；仅 REJECTED 时有值"}}}}}}
        "404": {$ref: "#/components/responses/Err"}
  /api/v1/aftersales/{claim_no}/evidence:
    post:
      summary: 买家补充凭证（仅在审核端状态为 NEED_MORE_EVIDENCE 时有效，转发至 Ops 并触发重新审核）
      parameters: [{name: claim_no, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence_urls]
              properties:
                evidence_urls: {type: array, minItems: 1, maxItems: 10, items: {type: string, description: "http(s)，≤1024 字符"}}
      responses:
        "202": {description: accepted, content: {application/json: {schema: {type: object, required: [claim_no, claim_status], properties: {claim_no: {type: string}, claim_status: {type: string}}}}}}
        "400": {$ref: "#/components/responses/Err"}
        "404": {$ref: "#/components/responses/Err"}
        "409": {$ref: "#/components/responses/Err"}
        "502": {$ref: "#/components/responses/Err"}
        "504": {$ref: "#/components/responses/Err"}
  /internal/v1/refunds/execute:
    post:
      security: [{internal: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RefundExecuteIn"}}}
      responses:
        "200": {description: ok(含幂等重放), content: {application/json: {schema: {$ref: "#/components/schemas/RefundStatus"}}}}
        "404": {$ref: "#/components/responses/Err"}
        "409": {$ref: "#/components/responses/Err"}
        "422": {$ref: "#/components/responses/Err"}
  /internal/v1/refunds/status:
    get:
      security: [{internal: []}]
      parameters: [{name: refund_idempotency_key, in: query, required: true, schema: {type: string}}]
      responses:
        "200": {description: ok(NOT_FOUND 也是 200), content: {application/json: {schema: {$ref: "#/components/schemas/RefundStatus"}}}}
  /internal/v1/aftersales/{claim_no}/result:
    post:
      summary: EcomOps 回写售后终态（REJECTED/WITHDRAWN）：订单恢复 FULFILLED，幂等
      security: [{internal: []}]
      parameters: [{name: claim_no, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [result], properties: {result: {type: string, enum: [REJECTED, WITHDRAWN]}, reason: {type: string, maxLength: 200, nullable: true, description: "驳回原因（REJECTED 时存入 aftersale_requests.result_reason，买家在进度接口看到）"}}}}}
      responses:
        "200": {description: ok}
        "404": {$ref: "#/components/responses/Err"}
        "409": {$ref: "#/components/responses/Err"}
  /api/v1/chat/stream:
    post:
      summary: "聊天 SSE (event: token|card|done|error)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, message]
              properties: {session_id: {type: string}, message: {type: string}, confirmed_order_id: {type: string}, confirmed_order_item_id: {type: string}}
      responses:
        "200": {description: text/event-stream, content: {text/event-stream: {schema: {type: string}}}}
        "403": {$ref: "#/components/responses/Err"}
  /internal/v1/catalog/skus/{sku_id}:
    get:
      summary: 按租户读取商品快照（金额为整数分）
      security: [{internal: []}]
      parameters:
        - {name: sku_id, in: path, required: true, schema: {type: string}}
        - {name: tenant_id, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: 商品快照
          content:
            application/json:
              schema:
                type: object
                required: [sku_id, tenant_id, shop_id, catalog_category_id, category_name, brand_name, sku_name, unit_price_cents, sellable_stock, positive_review_ratio]
                properties:
                  sku_id: {type: string}
                  tenant_id: {type: string}
                  shop_id: {type: string}
                  catalog_category_id: {type: string}
                  category_name: {type: string}
                  brand_name: {type: string, nullable: true}
                  sku_name: {type: string}
                  unit_price_cents: {type: integer, format: int64}
                  sellable_stock: {type: integer}
                  positive_review_ratio: {type: number, format: double}
        "400": {$ref: "#/components/responses/Err"}
        "401": {$ref: "#/components/responses/Err"}
        "404": {$ref: "#/components/responses/Err"}
  /internal/v1/catalog/categories:
    get:
      summary: 读取商品品类目录
      security: [{internal: []}]
      responses:
        "200":
          description: 品类列表
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      required: [catalog_category_id, parent_id, category_name, item_type]
                      properties:
                        catalog_category_id: {type: string}
                        parent_id: {type: string, nullable: true}
                        category_name: {type: string}
                        item_type: {type: string, enum: [PHYSICAL, SERVICE]}
        "401": {$ref: "#/components/responses/Err"}
