services:
  mysql:
    image: mysql:8.0
    container_name: ecompilot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ecompilot_root
      MYSQL_DATABASE: ecompilot
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--max-connections=500", "--default-time-zone=+08:00"]
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pecompilot_root"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - ecompilot_mysql_data:/var/lib/mysql
volumes:
  ecompilot_mysql_data:
